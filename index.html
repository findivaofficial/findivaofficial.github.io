<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>FINDIVA — Your Match. Our Search.</title>

  <meta name="description"
        content="FINDIVA — Your Match. Our Search. Human-led matchmaking search for Sri Lankans worldwide.">

  <meta name="theme-color"
        content="#10172f">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #10172f;
      color: #ffffff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .brand {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .tagline {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1.5px;
      margin-bottom: 22px;
    }

    .intro {
      max-width: 620px;
      margin: 0 auto 35px;
      color: #d9deed;
      font-size: 17px;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px 28px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: .92;
    }

    .primary {
      background: #ffffff;
      color: #10172f;
    }

    .secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
    }

    .privacy {
      margin-top: 38px;
      font-size: 13px;
      color: #aeb6cc;
    }

    .loading {
      margin-top: 25px;
      font-size: 13px;
      color: #aeb6cc;
    }

    @media (max-width: 600px) {

      .brand {
        font-size: 40px;
      }

      .tagline {
        font-size: 16px;
      }

      .intro {
        font-size: 15px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      FINDIVA
    </div>

    <div class="tagline">
      YOUR MATCH. OUR SEARCH.
    </div>

    <div class="intro">
      Human-led matchmaking search for Sri Lankans,
      wherever life takes you.
    </div>

    <div class="buttons">

      <button
        class="primary"
        onclick="openFINDIVA()">
        ENTER FINDIVA
      </
