<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>FINDIVA — Your Match. Our Search.</title>

  <meta name="description"
        content="FINDIVA — Your Match. Our Search. Human-led matchmaking search for Sri Lankans worldwide.">

  <meta name="theme-color"
        content="#10172f">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #10172f;
      color: #ffffff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      text-align: center;
    }

    .brand {
      font-size: 52px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-bottom: 10px;
    }

    .tagline {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }

    .intro {
      max-width: 620px;
      margin: 0 auto 34px;
      color: #d9deed;
      font-size: 17px;
      line-height: 1.7;
    }

    .status {
      font-size: 15px;
      color: #aeb6cc;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .countdown {
      font-weight: 700;
      color: #ffffff;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 15px 28px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background: #ffffff;
      color: #10172f;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.92;
    }

    .privacy {
      margin-top: 38px;
      font-size: 13px;
      color: #aeb6cc;
      line-height: 1.6;
    }

    @media (max-width: 600px) {

      .brand {
        font-size: 40px;
      }

      .tagline {
        font-size: 16px;
      }

      .intro {
        font-size: 15px;
      }

      button {
        width: 100%;
        max-width: 320px;
      }

    }

  </style>
</head>

<body>

  <main class="container">

    <div class="brand">
      FINDIVA
    </div>

    <div class="tagline">
      YOUR MATCH. OUR SEARCH.
    </div>

    <div class="intro">
      Human-led matchmaking search for Sri Lankans,
      wherever life takes you.
    </div>

    <div class="status">
      Opening FINDIVA in
      <span id="countdown" class="countdown">7</span>
      seconds...
    </div>

    <button onclick="openFINDIVA()">
      ENTER FINDIVA NOW
    </button>

    <div class="privacy">
      Your Match. Our Search.<br>
      Built for Sri Lankans worldwide.
    </div>

  </main>

  <script>

    const findivaURL =
      "https://script.google.com/a/macros/hi2mail.com/s/AKfycbzGfzm2XtNUv9rcvLfiYdryeAkqdbrg3D26PB7bP0GEComFhUUt7W5idRvNNJNTXkS6/exec";

    let seconds = 7;

    function openFINDIVA() {
      window.location.href = findivaURL;
    }

    const countdownElement =
      document.getElementById("countdown");

    const timer = setInterval(function () {

      seconds--;

      countdownElement.textContent = seconds;

      if (seconds <= 0) {

        clearInterval(timer);

        openFINDIVA();

      }

    }, 1000);

  </script>

</body>
</html>
